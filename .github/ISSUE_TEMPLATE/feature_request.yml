name: Feature request
description: Propose a change around a concrete reviewer or deployment need.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who encounters this problem, and what do they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change and how its success can be checked.
    validations:
      required: true
